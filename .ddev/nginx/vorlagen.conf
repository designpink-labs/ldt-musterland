# LDT: Dokumentvorlagen mit korrektem MIME-Typ (Strato: web/.htaccess).
location ~* \.dotx$ { types { application/vnd.openxmlformats-officedocument.wordprocessingml.template dotx; } try_files $uri =404; }
location ~* \.ott$ { types { application/vnd.oasis.opendocument.text-template ott; } try_files $uri =404; }
